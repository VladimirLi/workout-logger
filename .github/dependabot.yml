# Automated dependency pull requests (D-040). Every one must pass the complete
# applicable gate suite and receive independent review, exactly like a hand-written
# change.
#
# Grouping is deliberate: an ungrouped monorepo produces a dozen PRs a week, each
# needing a full gate run and a review, and the review quality collapses.

version: 2

updates:
  - package-ecosystem: npm # covers pnpm workspaces
    directories:
      - '/'
      - '/apps/*'
      - '/packages/*'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps)'
    labels:
      - dependencies
    groups:
      # Framework upgrades move together or not at all; a partial React/Next bump
      # produces a peer-dependency puzzle rather than a reviewable change.
      react-and-next:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'eslint-config-next'
      test-tooling:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@playwright/test'
          - 'happy-dom'
          - '@axe-core/*'
          - 'axe-core'
      # Guardrail tooling is grouped so that a change to the gates arrives as ONE
      # reviewable guardrail PR, per D-036.
      guardrail-tooling:
        patterns:
          - '@biomejs/biome'
          - 'dependency-cruiser'
          - 'typescript'
          - 'secretlint'
          - '@secretlint/*'
          - '@commitlint/*'
          - 'husky'
          - 'lint-staged'
      release-tooling:
        patterns:
          - '@changesets/*'
      spec-tooling:
        patterns:
          - '@fission-ai/openspec'
      # Everything else, patch and minor only, as one PR.
      remaining-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript is pinned to the 6.x line on purpose: dependency-cruiser 18.x
      # declares support for `typescript >=2.0.0 <7.0.0`, and under TypeScript 7 it
      # silently falls back to a non-TypeScript parser, which makes the architecture
      # gate blind. See docs/adr/0001 and the establish-project-foundation design.
      # Remove this entry only together with a dependency-cruiser release that
      # supports TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7.0.0']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies
      - guardrail
    groups:
      github-actions:
        patterns:
          - '*'
