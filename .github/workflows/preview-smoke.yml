name: preview-smoke

# Smoke-checks the Vercel preview deployment of a pull request (ADR-0013 sections 1-3).
#
# This workflow does not deploy. Vercel's GitHub integration builds each preview and holds
# the Vercel credentials, so no deploy token is stored in GitHub. The workflow only runs
# after Vercel reports a finished preview, and reaches the protected URL with a GitHub
# Actions OIDC token through Vercel Trusted Sources. Nothing here is a required check.
#
# Needs, all created by Vladimir (docs/runbooks/preview-deploys.md): the Vercel project, its
# Git integration, a Trusted Sources rule for this repository, and the repository variable
# VERCEL_PROJECT_NAME. Until then no event arrives and this workflow does not run.
#
# GUARDRAIL FILE.

on:
  # Runs from the default branch's copy of this file, so a change to it takes effect
  # only after it is merged. Use workflow_dispatch to try it first.
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      url:
        description: Preview deployment URL, https://<name>.vercel.app
        required: true
        type: string

permissions: {}

concurrency:
  group: preview-smoke-${{ github.event.client_payload.git.sha || inputs.url }}
  cancel-in-progress: true

jobs:
  smoke:
    name: preview smoke
    if: >-
      github.event_name == 'workflow_dispatch'
      || (vars.VERCEL_PROJECT_NAME != ''
          && github.event.client_payload.environment == 'preview'
          && github.event.client_payload.project.name == vars.VERCEL_PROJECT_NAME)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Check the preview URL
        env:
          PAYLOAD_URL: ${{ github.event.client_payload.url }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          url="${PAYLOAD_URL:-$INPUT_URL}"
          # The OIDC token is sent to this host, so refuse anything but a bare vercel.app origin.
          [[ "$url" =~ ^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?\.vercel\.app$ ]] || { echo "refusing to send an OIDC token to '$url'" >&2; exit 1; }
          echo "PREVIEW_URL=$url" >>"$GITHUB_ENV"

      - name: Preview is closed to anonymous requests
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$PREVIEW_URL/today")
          echo "anonymous GET /today -> $status"
          if [[ "$status" == 2* ]]; then
            echo "preview served an anonymous request: Vercel Authentication is off" >&2
            exit 1
          fi

      - name: Preview serves with an OIDC token
        run: |
          set -euo pipefail
          # Default audience for a Vercel Trusted Sources GitHub rule: https://github.com/<owner>
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/$GITHUB_REPOSITORY_OWNER" | jq -er .value)
          echo "::add-mask::$token"
          printf 'x-vercel-trusted-oidc-idp-token: %s\n' "$token" >"$RUNNER_TEMP/oidc-header"
          for path in /today /manifest.webmanifest; do
            # A fresh alias can lag the event, so retry before failing.
            curl -sS -o /dev/null --fail --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors \
              -H "@$RUNNER_TEMP/oidc-header" "$PREVIEW_URL$path"
            echo "ok $path"
          done
