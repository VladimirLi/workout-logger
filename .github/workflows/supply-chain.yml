name: supply-chain

# SBOM and build provenance (R-026, R-029). Target: SLSA Build Level 2 for the first
# release. Attestation needs GitHub OIDC, so it cannot be exercised locally —
# docs/external-gates.md, G-7.
#
# GUARDRAIL FILE.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: sbom and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # All three are required by actions/attest. id-token mints the OIDC token for
      # the Sigstore certificate, attestations persists the attestation, and
      # artifact-metadata creates the storage record. Omitting the third fails the step.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM from the lockfile
        # Deterministic and offline. This is the same command a developer can run.
        run: pnpm sbom:generate

      - name: Generate a second SBOM with syft, as a cross-check
        # Two independent tools reading the same lockfile. A large divergence means
        # one of them is misreading the workspace.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/sbom.syft.cdx.json
          upload-artifact: false

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: artifacts/*.cdx.json
          retention-days: 90

      - name: Attest SBOM provenance
        # Only on a release tag: an attestation per main-branch push is noise that
        # makes the real release attestation harder to find.
        #
        # actions/attest, not actions/attest-build-provenance: as of v4 the latter is
        # a wrapper over the former, and its own README says new implementations
        # should use actions/attest.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/sbom.cdx.json
