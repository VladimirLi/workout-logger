packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for dependency versions across the workspace.
# A package references `catalog:` instead of a literal range, so versions
# cannot drift between packages. See ENGINEERING.md.
catalog:
  '@axe-core/playwright': 4.13.0
  '@modelcontextprotocol/sdk': 1.31.0
  '@playwright/test': 1.63.0
  '@storybook/addon-a11y': 10.6.0
  '@storybook/nextjs-vite': 10.6.0
  '@types/node': 26.6.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitest/coverage-v8': 5.0.1
  happy-dom: 20.14.5
  next: 16.3.8
  react: 19.3.0
  react-dom: 19.3.0
  storybook: 10.6.0
  typescript: 6.0.3
  vite: 8.3.1
  vitest: 5.0.1
  zod: 4.6.5

# pnpm 11 quarantines freshly published versions. Strict mode makes it PROMPT rather
# than silently appending to minimumReleaseAgeExclude during an install, which would
# otherwise rewrite this file (a guardrail file) on a developer machine and in CI.
minimumReleaseAgeStrict: true

# Versions accepted explicitly despite being inside the quarantine window. Each entry
# is a decision to trust a recently published version.
minimumReleaseAgeExclude:
  - '@types/node@26.6.2'
  - '@vitest/coverage-v8@5.0.1'
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1

# sharp is an optionalDependency of Next.js, used only for image optimization.
# The product ships no images, and sharp pulls a prebuilt libvips binary licensed
# LGPL-3.0-or-later into the RUNTIME dependency graph. Dropping it removes the only
# copyleft component from the shipped tree; `images.unoptimized` in
# apps/web/next.config.ts makes the consequence explicit.
ignoredOptionalDependencies:
  - sharp
  - '@img/*'

# Dependency lifecycle scripts (preinstall/install/postinstall), in the form pnpm 11
# applies. pnpm 11 ignores the pnpm 10 `onlyBuiltDependencies` list this replaces, so that
# list was an allowlist in name only.
#
# strictDepBuilds makes any build script that is not decided here FAIL the install, rather
# than being skipped with a warning. allowBuilds is the decision map: `name: true` lets a
# package run its scripts, `name: false` records that it must not.
#
# The map holds exactly one grant. esbuild@0.28.2 arrives with the Storybook toolchain
# (storybook and vite) and its postinstall (`node install.js`) selects and verifies the
# platform binary. Vladimir approved the Storybook dependency change and this separate
# build-permission change on 2026-09-17 (DESIGN_SYSTEM.md, governance.lab.storybook).
# No other installed dependency has a lifecycle script: unrs-resolver is not in the tree,
# @biomejs/biome ships none, and sharp is excluded above. Granting permission to packages
# that are not here would be a standing licence for some future version of them to run code
# at install time unreviewed. scripts/build-permissions.test.ts checks this against pnpm's
# effective configuration and the installed tree. Adding an entry is a supply-chain decision
# and a guardrail change.
strictDepBuilds: true
allowBuilds:
  esbuild: true

# Override shell-quote to fix critical GHSA-pqg4-j6r4-53mv advisory (command injection via quote()).
# The advisory was disclosed after launch-editor was released with shell-quote@1.10.0.
# Version 1.12.0 fixes the vulnerability. This override is valid because shell-quote is
# a transitive dep of @changesets/cli (launch-editor > shell-quote) and should never be
# pinned lower at the app level. Remove when launch-editor or @changesets/cli bump shell-quote.
overrides:
  shell-quote: 1.12.0
